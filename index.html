<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>emu</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="device" id="device">
  <canvas class="screen" id="screen" width="180" height="164"></canvas>

  <div class="dpad" id="dpad" role="group" aria-label="十字パッド">
    <i class="arm up"></i><i class="arm down"></i><i class="arm left"></i><i class="arm right"></i>
    <i class="finger"></i>
  </div>

  <button class="btn" data-btn="tl" aria-label="左上ボタン"></button>
  <button class="btn" data-btn="tr" aria-label="右上ボタン"></button>
  <button class="btn" data-btn="bl" aria-label="左下ボタン"></button>
  <button class="btn" data-btn="br" aria-label="右下ボタン"></button>
</main>
<script src="emu.js"></script>
<script src="demo.js"></script>
</body>
</html>
